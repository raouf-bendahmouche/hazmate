<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — License Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:      #0b0f1a;
      --bg-card:      rgba(255,255,255,0.04);
      --bg-card-hover:rgba(255,255,255,0.07);
      --border:       rgba(255,255,255,0.08);
      --border-focus: rgba(99,179,237,0.6);
      --accent:       #3b82f6;
      --accent-dark:  #2563eb;
      --accent-glow:  rgba(59,130,246,0.35);
      --danger:       #ef4444;
      --text-primary: #f0f4ff;
      --text-muted:   #6b7a99;
      --input-bg:     rgba(255,255,255,0.06);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
    }

    /* ── Background Gradient Orbs ── */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 600px; height: 600px;
      top: -150px; left: -100px;
      background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%);
    }
    body::after {
      width: 500px; height: 500px;
      bottom: -100px; right: -80px;
      background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
    }

    /* ── Layout ── */
    .login-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 32px 64px rgba(0,0,0,0.5),
        0 0 80px var(--accent-glow);
      animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Logo / Brand ── */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .brand-text h1 {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }
    .brand-text p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 400;
    }

    /* ── Headings ── */
    .login-heading {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .login-subheading {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 32px;
      font-weight: 400;
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(99,179,237,0.12);
      background: rgba(255,255,255,0.08);
    }

    input::placeholder { color: rgba(107,122,153,0.7); }

    /* Password toggle */
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--text-primary); }

    /* ── Error Banner ── */
    #login-error {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 20px;
      animation: shake 0.35s ease;
    }
    #login-error.visible { display: flex; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60%  { transform: translateX(-5px); }
      40%,80%  { transform: translateX(5px); }
    }

    /* ── Submit Button ── */
    .btn-login {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover:not(:disabled) {
      opacity: 0.93;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px var(--accent-glow);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* Loading spinner inside button */
    .btn-login .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner  { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Footer hint ── */
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon">🛡️</div>
      <div class="brand-text">
        <h1>MatHaz Manager</h1>
        <p>Hazardous Material Transport Licensing</p>
      </div>
    </div>

    <p class="login-heading">Welcome back</p>
    <p class="login-subheading">Sign in to access the management system.</p>

    <!-- Error banner -->
    <div id="login-error" role="alert">
      <span>⚠️</span>
      <span id="login-error-text">Invalid credentials. Please try again.</span>
    </div>

    <!-- Form -->
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="login-username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="toggle-pw"
            id="toggle-password"
            aria-label="Toggle password visibility"
            title="Show/hide password"
          >👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btn-login">
        <span class="btn-text">Sign In</span>
        <span class="spinner"></span>
      </button>
    </form>

    <p class="login-footer">
      Secure access · All sessions are protected
    </p>

  </div>
</div>

<script>
  /* ── Config ── */
  let API_BASE = "http://127.0.0.1:5757";

  async function initApiBase() {
    if (window.electronAPI) {
      API_BASE = await window.electronAPI.getApiBase();
    }
  }

  /* ── DOM refs ── */
  const form      = document.getElementById("login-form");
  const userInput = document.getElementById("login-username");
  const pwInput   = document.getElementById("login-password");
  const btnLogin  = document.getElementById("btn-login");
  const errorBox  = document.getElementById("login-error");
  const errorText = document.getElementById("login-error-text");
  const togglePw  = document.getElementById("toggle-password");

  /* ── Password visibility toggle ── */
  togglePw.addEventListener("click", () => {
    const visible = pwInput.type === "text";
    pwInput.type = visible ? "password" : "text";
    togglePw.textContent = visible ? "👁️" : "🙈";
  });

  /* ── Show / hide error ── */
  function showError(msg) {
    errorText.textContent = msg;
    errorBox.classList.add("visible");
    // Re-trigger animation
    errorBox.style.animation = "none";
    requestAnimationFrame(() => { errorBox.style.animation = ""; });
  }

  function hideError() {
    errorBox.classList.remove("visible");
  }

  /* ── Loading state ── */
  function setLoading(on) {
    btnLogin.disabled = on;
    btnLogin.classList.toggle("loading", on);
  }

  /* ── Form submit ── */
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();

    const username = userInput.value.trim();
    const password = pwInput.value;

    if (!username || !password) {
      showError("Please enter both username and password.");
      return;
    }

    setLoading(true);

    try {
      const resp = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });

      const json = await resp.json();

      if (!resp.ok || json.status === "error") {
        showError(json.message || "Invalid credentials. Please try again.");
        setLoading(false);
        return;
      }

      /* ── Success: store token and navigate to main app ── */
      const { token, username: user, role } = json.data;
      sessionStorage.setItem("auth_token", token);
      sessionStorage.setItem("auth_user",  user);
      sessionStorage.setItem("auth_role",  role);

      // Navigate to main application page
      window.location.href = "../index.html";

    } catch (err) {
      showError("Cannot reach the server. Please ensure the application is running.");
      setLoading(false);
    }
  });

  /* ── On page load: check if already authenticated ── */
  (async () => {
    await initApiBase();

    const token = sessionStorage.getItem("auth_token");
    if (token) {
      try {
        const resp = await fetch(`${API_BASE}/auth/validate`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (resp.ok) {
          window.location.href = "../index.html";
          return;
        }
      } catch (_) { /* not authenticated — stay on login */ }
    }

    // Focus username field for UX
    userInput.focus();
  })();
</script>
</body>
</html>
